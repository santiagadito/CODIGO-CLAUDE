plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

version = '1.0.0'
group = 'net.sherfy.crystaldrops'
archivesBaseName = 'crystal-drops-addon'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'parchment', version: '2023.09.03-1.20.1'

    copyIdeResources = true

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                crystaldrops { source sourceSets.main }
            }
        }
    }
}

repositories {
    maven { url 'https://maven.parchmentmc.org' }
    // Crystal Leveling jar placed in libs/ folder
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'

    // Crystal Leveling mod — place the jar in the libs/ folder
    compileOnly fg.deobf(files('libs/crystal_leveling-1.0-forge1.20.1.jar'))
}

jar {
    from sourceSets.main.output
    manifest {
        attributes([
            'Specification-Title'      : 'crystaldrops',
            'Specification-Vendor'     : 'crystaldrops',
            'Specification-Version'    : '1',
            'Implementation-Title'     : project.name,
            'Implementation-Version'   : project.jar.archiveVersion,
            'Implementation-Vendor'    : 'crystaldrops',
            'Implementation-Timestamp' : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Skip the reobfuscation step that ForgeGradle applies by default
// (the jar targets a deobf dev environment via fg.deobf dependency)
tasks.named('jar').configure { finalizedBy('reobfJar') }
