name: Build Guillotina Granizados

on:
  push:
    branches: [ "claude/trusting-hopper-YyEC4", "main" ]
    paths:
      - "guillotina-granizados/**"
  pull_request:
    paths:
      - "guillotina-granizados/**"
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('guillotina-granizados/build.gradle') }}
          restore-keys: gradle-

      - name: Grant execute permission to gradlew
        working-directory: guillotina-granizados
        run: chmod +x gradlew

      - name: Build mod
        working-directory: guillotina-granizados
        run: ./gradlew build --no-daemon

      - name: Upload .jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: guillotina-granizados-jar
          path: guillotina-granizados/build/libs/guillotina-granizados-*.jar
          retention-days: 30
